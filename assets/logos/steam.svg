<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
    <defs>
      <linearGradient id="steam-blue" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1b2838"/>
        <stop offset="100%" stop-color="#2a475e"/>
      </linearGradient>
      <linearGradient id="steam-accent" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#66c0f4"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </linearGradient>
      <filter id="steam-glow">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#66c0f4" flood-opacity="0.5"/>
      </filter>
    </defs>
    <!-- Outer Shield / Circle -->
    <circle cx="50" cy="50" r="42" fill="url(#steam-blue)" stroke="#66c0f4" stroke-width="2.5" filter="url(#steam-glow)"/>
    <!-- Valve Steam Mechanical Crank Mechanism -->
    <!-- Large wheel -->
    <circle cx="58" cy="40" r="14" fill="url(#steam-accent)"/>
    <circle cx="58" cy="40" r="7" fill="#1b2838"/>
    <!-- Connecting arm -->
    <path d="M54 44 L32 62 L38 70 L60 52 Z" fill="url(#steam-accent)"/>
    <!-- Small crank pin -->
    <circle cx="34" cy="65" r="9" fill="url(#steam-accent)"/>
    <circle cx="34" cy="65" r="4.5" fill="#1b2838"/>
  </svg>