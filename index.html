<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Recargas — Robot Interactivo 3D</title>
  <style>
    :root {
      --bg: #0b0c10;
      --eye-color: #ffffff;
      --eye-glow: rgba(56, 189, 248, 0.9);
      --eye-fringe: rgba(255, 110, 80, 0.5);
      --primary: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: #f1f5f9;
      user-select: none;
    }

    /* FONDO ESTUDIO CINEMATOGRÁFICO COMBINADO */
    .viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      overflow: hidden;
      background: 
        radial-gradient(circle at var(--spot-x, 50%) var(--spot-y, 40%), rgba(56, 189, 248, 0.08) 0%, rgba(20, 24, 33, 0.4) 40%, transparent 70%),
        radial-gradient(ellipse at 50% 100%, #171b26 0%, #0a0b0f 75%);
    }

    /* CANVAS DE POLVO / AMBIENTE CIBERNÉTICO */
    #ambient-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    /* HEADER MINIMALISTA */
    header {
      position: absolute;
      top: 28px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      z-index: 30;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(188, 255, 72, 0.15));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #94a3b8;
      backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      pointer-events: auto;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseLive 2s infinite;
    }

    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .controls-top {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(18, 22, 32, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
    }

    .icon-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(56, 189, 248, 0.5);
      color: #38bdf8;
      transform: scale(1.08);
    }

    /* CONTENEDOR 3D DEL ROBOT REALISTA */
    .robot-scene {
      position: relative;
      width: min(720px, 92vw);
      height: min(760px, 86vh);
      perspective: 1200px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 10;
      margin-bottom: -20px;
    }

    .robot-rig {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-style: preserve-3d;
      transform-origin: 50% 85%;
      will-change: transform;
    }

    /* CUERPO Y CABEZA DEL ROBOT REALISTA */
    .robot-character {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      transform-style: preserve-3d;
      animation: subtleBreathing 4.5s ease-in-out infinite;
    }

    @keyframes subtleBreathing {
      0%, 100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-4px) scale(1.003);
      }
    }

    .robot-photo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.85));
      pointer-events: none;
    }

    /* PANTALLA CRT INTERACTIVA Y OJOS DINÁMICOS QUE SIGUEN EL CURSOR */
    .crt-screen-overlay {
      position: absolute;
      top: 7.2%;
      left: 22.8%;
      width: 53.8%;
      height: 48.2%;
      border-radius: 18px;
      overflow: hidden;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    /* PANTALLA DE FONDO OSCURA CON RESPLANDOR */
    .crt-dark-glass {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #0f1519 0%, #06080a 90%);
      opacity: 0.96;
    }

    /* LÍNEAS DE ESCANEO CRT */
    .crt-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.7) 0px,
        rgba(0, 0, 0, 0.7) 1.5px,
        transparent 1.5px,
        transparent 3px
      );
      opacity: 0.35;
      pointer-events: none;
      z-index: 10;
    }

    /* CURVATURA DE PANTALLA CRT */
    .crt-glare {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.02) 30%,
        transparent 60%
      );
      pointer-events: none;
      z-index: 11;
    }

    /* OJOS REACTIVOS QUE SIGUEN EL RATÓN */
    .robot-eye {
      position: absolute;
      width: 25.5%;
      height: 38%;
      border-radius: 50%;
      background: radial-gradient(
        circle at center,
        #ffffff 35%,
        var(--eye-color, #ffffff) 65%,
        var(--eye-glow, rgba(56, 189, 248, 0.9)) 85%,
        transparent 100%
      );
      box-shadow: 
        0 0 35px 12px var(--eye-glow, rgba(56, 189, 248, 0.9)),
        inset 0 0 15px 4px rgba(255, 255, 255, 0.95),
        -4px 0 16px var(--eye-fringe, rgba(255, 110, 80, 0.5)),
        4px 0 16px rgba(56, 189, 248, 0.6);
      transform-origin: center center;
      transition: height 0.12s ease, border-radius 0.14s ease, opacity 0.12s ease;
      will-change: transform;
      z-index: 5;
    }

    .eye-left {
      top: 31%;
      left: 17%;
    }

    .eye-right {
      top: 29.5%;
      right: 17%;
    }

    .eye-blink {
      height: 3px !important;
      border-radius: 2px !important;
      opacity: 0.4 !important;
    }

    .eye-squint {
      height: 18% !important;
      border-radius: 14px 14px 2px 2px !important;
    }

    /* REFLEJO DE LUZ DEL ROBOT SOBRE EL CUELLO */
    .robot-light-reflection {
      position: absolute;
      bottom: 24%;
      left: 50%;
      transform: translateX(-50%);
      width: 48%;
      height: 20%;
      background: radial-gradient(ellipse at top, var(--eye-glow) 0%, transparent 70%);
      opacity: 0.18;
      filter: blur(14px);
      pointer-events: none;
      transition: opacity 0.2s;
    }

    /* TEXTO HOLOGRÁFICO DEL ROBOT */
    .robot-speech-balloon {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      background: rgba(10, 14, 22, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #ffffff;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
      backdrop-filter: blur(14px);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 40;
    }

    .robot-speech-balloon.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }

    .robot-speech-balloon::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 8px;
      height: 8px;
      background: rgba(10, 14, 22, 0.92);
      border-right: 1px solid rgba(56, 189, 248, 0.4);
      border-bottom: 1px solid rgba(56, 189, 248, 0.4);
    }

    /* FOOTER SUTIL Y ELEGANTE */
    footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      z-index: 30;
      pointer-events: none;
    }

    .footer-hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.04em;
    }

    .footer-hint span.dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #475569;
    }

    .palette-dock {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 10px;
      border-radius: 9999px;
      backdrop-filter: blur(12px);
      pointer-events: auto;
    }

    .palette-btn {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform 0.2s, border-color 0.2s;
    }

    .palette-btn.active {
      transform: scale(1.3);
      border-color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="viewport" id="viewport">
    <!-- CANVAS DE POLVO / AMBIENTE -->
    <canvas id="ambient-canvas"></canvas>

    <!-- HEADER MINIMALISTA -->
    <header>
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-title">Centro de Recargas</div>
          <div class="brand-subtitle">Asistente Virtual Cibernético</div>
        </div>
      </div>

      <div class="controls-top">
        <div class="status-badge">
          <div class="status-pulse"></div>
          <span>SEGUIMIENTO OCULAR: ACTIVO</span>
        </div>

        <button id="btn-audio" class="icon-btn" title="Activar/Desactivar sonido robótico">
          🔇
        </button>
      </div>
    </header>

    <!-- ESCENA 3D DEL ROBOT REALISTA -->
    <div class="robot-scene" id="robot-scene">
      <div class="robot-rig" id="robot-rig">

        <!-- Globo de diálogo holográfico -->
        <div id="speech-balloon" class="robot-speech-balloon">
          ¡SISTEMAS SINCRONIZADOS! ⚡
        </div>

        <div class="robot-character" id="robot-character">
          <!-- Fotografía del robot realista con fondo transparente -->
          <img src="robot-full.png" alt="Robot TV Realista" class="robot-photo" />

          <!-- Resplandor proyectado sobre el cuello -->
          <div class="robot-light-reflection" id="light-reflection"></div>

          <!-- PANTALLA CRT CON OJOS INTERACTIVOS -->
          <div class="crt-screen-overlay">
            <div class="crt-dark-glass"></div>
            <div class="crt-lines"></div>
            <div class="crt-glare"></div>

            <!-- Ojo Izquierdo que sigue el cursor -->
            <div id="eye-left" class="robot-eye eye-left"></div>

            <!-- Ojo Derecho que sigue el cursor -->
            <div id="eye-right" class="robot-eye eye-right"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- FOOTER SUTIL -->
    <footer>
      <div class="footer-hint">
        <span>Mueve el cursor por la pantalla para que el robot te siga con la mirada</span>
        <span class="dot"></span>
        <span>Haz clic para interactuar</span>
      </div>

      <!-- Selector de color para los ojos -->
      <div class="palette-dock">
        <span style="font-size: 11px; color: #94a3b8; margin-right: 4px;">Energía:</span>
        <div class="palette-btn active" style="background: #38bdf8;" onclick="setRobotEnergy('cyan', this)" title="Cian Eléctrico"></div>
        <div class="palette-btn" style="background: #ffffff;" onclick="setRobotEnergy('white', this)" title="Blanco Puro"></div>
        <div class="palette-btn" style="background: #10b981;" onclick="setRobotEnergy('emerald', this)" title="Esmeralda"></div>
        <div class="palette-btn" style="background: #c084fc;" onclick="setRobotEnergy('purple', this)" title="Púrpura"></div>
        <div class="palette-btn" style="background: #f59e0b;" onclick="setRobotEnergy('amber', this)" title="Ámbar Solar"></div>
      </div>
    </footer>
  </div>

  <script>
    // ESTADO GENERAL
    const state = {
      mouseX: window.innerWidth / 2,
      mouseY: window.innerHeight / 2,
      targetNormX: 0,
      targetNormY: 0,
      currentNormX: 0,
      currentNormY: 0,
      rotX: 0,
      rotY: 0,
      rotZ: 0,
      audio: false,
      isMouseDown: false,
      speechTimer: 200,
      currentTheme: 'cyan'
    };

    const PALETTES = {
      cyan: {
        color: '#ffffff',
        glow: 'rgba(56, 189, 248, 0.95)',
        fringe: 'rgba(255, 110, 80, 0.55)',
        primary: '#38bdf8'
      },
      white: {
        color: '#ffffff',
        glow: 'rgba(255, 255, 255, 0.95)',
        fringe: 'rgba(160, 210, 255, 0.6)',
        primary: '#ffffff'
      },
      emerald: {
        color: '#ffffff',
        glow: 'rgba(16, 185, 129, 0.95)',
        fringe: 'rgba(52, 211, 153, 0.5)',
        primary: '#10b981'
      },
      purple: {
        color: '#ffffff',
        glow: 'rgba(192, 132, 252, 0.95)',
        fringe: 'rgba(236, 72, 153, 0.5)',
        primary: '#c084fc'
      },
      amber: {
        color: '#ffffff',
        glow: 'rgba(245, 158, 11, 0.95)',
        fringe: 'rgba(239, 68, 68, 0.55)',
        primary: '#f59e0b'
      }
    };

    // DOM ELEMENTS
    const viewport = document.getElementById('viewport');
    const robotRig = document.getElementById('robot-rig');
    const eyeLeft = document.getElementById('eye-left');
    const eyeRight = document.getElementById('eye-right');
    const speechBalloon = document.getElementById('speech-balloon');
    const lightReflection = document.getElementById('light-reflection');
    const btnAudio = document.getElementById('btn-audio');

    // WEB AUDIO API NATIVO
    let audioCtx = null;
    function playRobotSound(type) {
      if (!state.audio) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'chirp') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(480, now);
          osc.frequency.exponentialRampToValueAtTime(920, now + 0.1);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.start(now);
          osc.stop(now + 0.12);
        } else if (type === 'blink') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(740, now);
          osc.frequency.linearRampToValueAtTime(540, now + 0.08);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'servo') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.exponentialRampToValueAtTime(380, now + 0.15);
          gain.gain.setValueAtTime(0.02, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (err) {
        console.warn(err);
      }
    }

    // AUDIO TOGGLE
    btnAudio.addEventListener('click', () => {
      state.audio = !state.audio;
      btnAudio.innerText = state.audio ? '🔊' : '🔇';
      btnAudio.style.color = state.audio ? '#38bdf8' : '#cbd5e1';
      if (state.audio) {
        playRobotSound('chirp');
        showSpeech('AUDIO ROBÓTICO: ACTIVO 🔊');
      }
    });

    function showSpeech(text) {
      speechBalloon.innerText = text;
      speechBalloon.classList.add('visible');
      state.speechTimer = 220;
    }

    function setRobotEnergy(themeKey, dotEl) {
      document.querySelectorAll('.palette-btn').forEach(d => d.classList.remove('active'));
      dotEl.classList.add('active');
      state.currentTheme = themeKey;

      const t = PALETTES[themeKey];
      document.documentElement.style.setProperty('--eye-color', t.color);
      document.documentElement.style.setProperty('--eye-glow', t.glow);
      document.documentElement.style.setProperty('--eye-fringe', t.fringe);
      document.documentElement.style.setProperty('--primary', t.primary);

      playRobotSound('chirp');
      showSpeech('ENERGÍA SINCRONIZADA ✨');
    }

    // SEGUIMIENTO DEL CURSOR
    window.addEventListener('mousemove', (e) => {
      state.mouseX = e.clientX;
      state.mouseY = e.clientY;

      // Calcular posición del robot en pantalla
      const rect = robotRig.getBoundingClientRect();
      const robotCenterX = rect.left + rect.width / 2;
      const robotCenterY = rect.top + rect.height * 0.35; // Centro del televisor

      // Normalizar offsets entre -1 y 1
      state.targetNormX = Math.max(-1, Math.min(1, (e.clientX - robotCenterX) / (window.innerWidth * 0.45)));
      state.targetNormY = Math.max(-1, Math.min(1, (e.clientY - robotCenterY) / (window.innerHeight * 0.45)));

      // Mover suavemente la luz ambiental del fondo
      viewport.style.setProperty('--spot-x', `${(e.clientX / window.innerWidth) * 100}%`);
      viewport.style.setProperty('--spot-y', `${Math.max(25, (e.clientY / window.innerHeight) * 65)}%`);
    }, { passive: true });

    // REACCIÓN AL CLIC
    window.addEventListener('mousedown', (e) => {
      if (e.target.closest('header, footer, button')) return;
      state.isMouseDown = true;
      eyeLeft.classList.add('eye-squint');
      eyeRight.classList.add('eye-squint');
      playRobotSound('chirp');

      const msgs = [
        '¡TE VEO! 👀',
        'OBJETIVO FIJADO 🎯',
        'SISTEMAS OPERATIVOS ⚡',
        'CENTRO DE RECARGAS LISTO 🚀'
      ];
      showSpeech(msgs[Math.floor(Math.random() * msgs.length)]);
    });

    window.addEventListener('mouseup', () => {
      state.isMouseDown = false;
      setTimeout(() => {
        eyeLeft.classList.remove('eye-squint');
        eyeRight.classList.remove('eye-squint');
      }, 260);
    });

    // PARPADEO NATURAL
    let blinkTimer = 0;
    function triggerBlink() {
      eyeLeft.classList.add('eye-blink');
      eyeRight.classList.add('eye-blink');
      playRobotSound('blink');
      setTimeout(() => {
        eyeLeft.classList.remove('eye-blink');
        eyeRight.classList.remove('eye-blink');
      }, 150);
    }

    // AMBIENTE DE POLVO / CHISPAS EN CANVAS
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -Math.random() * 0.45 - 0.15,
        size: Math.random() * 2 + 0.8,
        alpha: Math.random() * 0.5 + 0.2
      });
    }

    // BUCLE DE FÍSICA E INERCIA REALISTA
    let lastTime = performance.now();

    function render(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
      lastTime = currentTime;

      // 1. Interpolación suave (Spring / Lerp) del seguimiento
      state.currentNormX += (state.targetNormX - state.currentNormX) * 0.085;
      state.currentNormY += (state.targetNormY - state.currentNormY) * 0.085;

      // 2. Rotación 3D realista de la cabeza y el cuello
      // Yaw (giro lateral): hasta 24 grados
      // Pitch (inclinación vertical): hasta 16 grados
      // Roll (inclinación sutil): hasta 4 grados
      const targetRotY = state.currentNormX * 24;
      const targetRotX = -state.currentNormY * 16;
      const targetRotZ = state.currentNormX * 3.5;

      state.rotY += (targetRotY - state.rotY) * 0.1;
      state.rotX += (targetRotX - state.rotX) * 0.1;
      state.rotZ += (targetRotZ - state.rotZ) * 0.1;

      robotRig.style.transform = `perspective(1200px) rotateX(${state.rotX}deg) rotateY(${state.rotY}deg) rotateZ(${state.rotZ}deg)`;

      // 3. Desplazamiento de los ojos sobre la pantalla CRT (Paralaje realista)
      // Los ojos se mueven sobre la superficie del monitor buscando al cursor
      const maxEyeShiftX = 22; // píxeles máximos en X
      const maxEyeShiftY = 18; // píxeles máximos en Y

      const eyeShiftX = state.currentNormX * maxEyeShiftX;
      const eyeShiftY = state.currentNormY * maxEyeShiftY;

      eyeLeft.style.transform = `translate(${eyeShiftX}px, ${eyeShiftY}px)`;
      eyeRight.style.transform = `translate(${eyeShiftX}px, ${eyeShiftY}px)`;

      // 4. Parpadeo aleatorio realista cada 4-6 segundos
      blinkTimer++;
      if (blinkTimer > 280 + Math.random() * 80) {
        triggerBlink();
        blinkTimer = 0;
      }

      // 5. Ocultar globo de texto temporizado
      if (state.speechTimer > 0) {
        state.speechTimer--;
        if (state.speechTimer === 0) {
          speechBalloon.classList.remove('visible');
        }
      }

      // 6. Dibujar partículas de ambiente
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;

        if (p.y < 0) p.y = height;
        if (p.x < 0) p.x = width;
        if (p.x > width) p.x = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = PALETTES[state.currentTheme].primary;
        ctx.globalAlpha = p.alpha;
        ctx.fill();
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
